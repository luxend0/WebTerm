<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>webterm ›_</title>
  <meta name="description" content="A minimal terminal-like website in a single HTML file (pure HTML/CSS/JS)">
  <style>
    :root{
      --bg: #0b0f14;
      --panel: #0f141a;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #7ee787;
      --accent-2: #79c0ff;
      --danger: #ff7b72;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .theme-light{
      --bg:#f7f9fb; --panel:#ffffff; --text:#111826; --muted:#4b5563;
      --accent:#059669; --accent-2:#2563eb; --danger:#dc2626;
    }
    .theme-matrix{
      --bg:#000; --panel:#000; --text:#16ff8b; --muted:#0aff66; --accent:#16ff8b; --accent-2:#16ff8b; --danger:#16ff8b;
      background-image: repeating-linear-gradient(transparent 0 28px, rgba(22,255,139,.04) 28px 29px);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--text); font-family:var(--mono);
      display:grid; place-items:center; padding:18px;
    }
    .wrap{width:min(920px, 100%);}
    .frame{
      background:var(--panel); border:1px solid rgba(255,255,255,.06); border-radius:18px; box-shadow:var(--shadow);
      overflow:hidden;
    }
    .titlebar{
      display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    }
    .dots{display:flex; gap:8px;}
    .dot{width:12px;height:12px;border-radius:999px;}
    .dot.red{background:#ff5f56}
    .dot.yellow{background:#ffbd2e}
    .dot.green{background:#27c93f}
    .title{margin-left:6px; font-size:14px; color:var(--muted)}

    #terminal{
      padding:18px; min-height:55vh; max-height:75vh; overflow:auto; scrollbar-width:thin; line-height:1.6;
    }
    .line{ display:flex; gap:12px; align-items:flex-start; white-space:pre-wrap; word-break:break-word;}
    .prompt{ color:var(--accent-2);} 
    .caret{ display:inline-block; width:9px; background:var(--text); animation:blink 1.1s steps(1,end) infinite; margin-left:2px;}
    @keyframes blink{50%{opacity:0}}
    .muted{ color:var(--muted)}
    .accent{ color:var(--accent)}
    .danger{ color:var(--danger)}
    .cmdline{flex:1; display:block}
    input#input{
      width:100%; background:transparent; border:0; color:var(--text); font:inherit; outline:none;
      display:block; margin-top:2px;
    }
    .footer{display:flex; justify-content:space-between; padding:10px 14px; border-top:1px solid rgba(255,255,255,.08); color:var(--muted); font-size:12px}
    .badge{padding:.2rem .5rem; border:1px solid rgba(255,255,255,.12); border-radius:999px}
    .link{color:var(--accent-2); text-decoration:none}
    .link:hover{text-decoration:underline}
    kbd{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); padding:.15rem .35rem; border-radius:6px; font-size:.85em}
    .hl{background:rgba(125,211,252,.08); padding:0 .25em; border-radius:4px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="frame" role="application" aria-label="Web Terminal">
      <div class="titlebar">
        <div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
        <div class="title">webterm — pure HTML/CSS/JS</div>
      </div>
      <main id="terminal" aria-live="polite" aria-atomic="false" tabindex="-1"></main>
      <div class="footer">
        <div>Try <kbd>help</kbd> · <kbd>info</kbd> · <kbd>clear</kbd> · <kbd>theme</kbd></div>
        <div class="badge" id="theme-indicator">theme: dark</div>
      </div>
    </div>
  </div>

  <script>
  const USER_INFO = {
    name: "Luxend",
    role: "Developer",
    location: "Germany",
    stack: ["JavaScript", "C++", "Python", "Java", "php", "Linux", "Tailwind", "NodeJS"],
    about: `I'm a dev. I build full‑stack apps, small tools and clean UI. I like shipping fast, automating boring stuff, and keeping things simple.`,
    projects: [
      { name: "lxnd.cloud", desc: "Modular tools & utilities platform", url: "https://lxnd.cloud" }
    ],
    contact: {
      email: "hi@lxnd.cloud",
      site: "https://lxnd.cloud"
    }
  };

  const term = document.getElementById('terminal');
  const themeIndicator = document.getElementById('theme-indicator');
  const state = {
    history: [],
    idx: 0,
    commands: new Map(),
    themes: ['dark','light','matrix'],
    theme: 'dark',
  };

  function esc(str){
    return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[s]));
  }

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls; if(html!==undefined) e.innerHTML = html; return e;
  }

  function print(html, cls=""){
    const line = el('div', 'line '+cls);
    line.innerHTML = html; term.appendChild(line); autoscroll(); return line;
  }

  function prompt(){
    const path = '~';
    const row = el('div', 'line');
    row.appendChild(el('span', 'prompt', `guest@webterm`));
    row.appendChild(el('span', 'muted', `:${path}$`));
    const cmd = el('div', 'cmdline');
    const input = document.createElement('input'); input.id = 'input'; input.setAttribute('aria-label','command input'); input.autocapitalize='off'; input.autocomplete='off'; input.spellcheck=false;
    cmd.appendChild(input);
    row.appendChild(cmd);
    term.appendChild(row);
    input.focus();

    input.addEventListener('keydown', (ev)=>{
      if(ev.key==='Enter') { ev.preventDefault(); run(input.value); }
      else if(ev.key==='ArrowUp') { ev.preventDefault(); recall(-1, input); }
      else if(ev.key==='ArrowDown') { ev.preventDefault(); recall(1, input); }
      else if(ev.key==='Tab') { ev.preventDefault(); tabComplete(input); }
    });
  }

  function autoscroll(){ term.scrollTo({ top: term.scrollHeight }); }

  function recall(delta, input){
    if(!state.history.length) return; state.idx = Math.min(Math.max(state.idx + delta, 0), state.history.length);
    input.value = state.history[state.idx] ?? '';
    setTimeout(()=> input.setSelectionRange(input.value.length, input.value.length), 0);
  }

  function tabComplete(input){
    const [cmd, ...rest] = input.value.trim().split(/\s+/);
    if(!cmd){ input.value = 'help'; return; }
    const keys = [...state.commands.keys()];
    const matches = keys.filter(k => k.startsWith(cmd));
    if(matches.length===1){ input.value = [matches[0], ...rest].join(' '); }
    else if(matches.length>1){ print(matches.join('  '), 'muted'); }
  }

  function run(raw){
    const text = raw.trim();
    const cur = document.getElementById('input');
    if(cur){ cur.setAttribute('disabled',''); cur.removeAttribute('id'); }

    print(`<span class="prompt">guest@webterm</span>:<span class="muted">~</span>$ ${esc(text)}`);
    if(text) { state.history = [...state.history.slice(-99), text]; state.idx = state.history.length; }

    const [cmd, ...args] = text.split(/\s+/);
    const fn = state.commands.get(cmd) || state.commands.get('');
    Promise.resolve(fn(args)).finally(prompt);
  }

  function register(name, desc, handler){ state.commands.set(name, handler); helpIndex.push([name, desc]); }
  const helpIndex = [];

  register('help', 'Show available commands', ()=>{
    const rows = helpIndex
      .sort((a,b)=> a[0].localeCompare(b[0]))
      .map(([k,v])=>`  <span class="accent">${k.padEnd(8,' ')}</span> <span class="muted">${esc(v)}</span>`)
      .join('\n');
    print(`<div>Available commands:\n${rows}\n\nPro tip: <span class="hl">Tab</span> completes, <span class="hl">↑/↓</span> navigate history.</div>`);
  });

  register('info', 'About me (developer profile)', ()=>{
    const s = USER_INFO;
    const proj = s.projects.map(p=>`  - <a class="link" href="${p.url}" target="_blank" rel="noreferrer noopener">${esc(p.name)}</a> — ${esc(p.desc)}`).join('\n');
    const stack = s.stack.join(', ');
    print(`
<div>
<span class="accent">${esc(s.name)}</span> — ${esc(s.role)} · ${esc(s.location)}\n
${esc(s.about)}\n
<strong>Stack:</strong> ${esc(stack)}\n<strong>Projects:</strong>\n${proj || '  (add some in USER_INFO.projects)'}\n<strong>Contact:</strong> <a class="link" href="mailto:${esc(s.contact.email)}">${esc(s.contact.email)}</a> · <a class="link" href="${esc(s.contact.site)}" target="_blank" rel="noreferrer noopener">Website</a>
</div>`);
  });

  register('clear', 'Clear the screen', ()=>{ term.innerHTML=''; });
  register('echo', 'Print arguments', (args)=>{ print(esc(args.join(' '))); });
  register('date', 'Show current date/time', ()=>{ print(new Date().toString()); });
  register('whoami', 'Show current user', ()=>{ print('guest'); });
  register('pwd', 'Print working directory', ()=>{ print('/home/guest'); });
  register('ls', 'List directory contents', ()=>{ print('projects  notes.txt  README.md'); });
  register('cat', 'Display file contents', (args)=>{
    if(args[0]==='notes.txt') print('Just some notes...');
    else if(args[0]==='README.md') print('# WebTerm\nA terminal-like personal site.');
    else print(`cat: ${args[0]||''}: No such file`);
  });
  register('uname', 'Show system information', ()=>{ print('WebTermOS 1.0 (HTML/JS)'); });
  register('uptime', 'Show uptime', ()=>{ const s=Math.floor(performance.now()/1000); print(`up ${s} seconds`); });

  register('theme', 'Switch theme: dark | light | matrix', (args)=>{
    const want = (args[0]||'').toLowerCase();
    if(!want){
      const next = state.themes[(state.themes.indexOf(state.theme)+1) % state.themes.length];
      return applyTheme(next);
    }
    if(!state.themes.includes(want)) return print(`Unknown theme: ${esc(want)}. Try: ${state.themes.join(', ')}`, 'danger');
    applyTheme(want);
  });

  register('projects', 'List projects', ()=>{
    if(!USER_INFO.projects.length) return print('(no projects yet)');
    USER_INFO.projects.forEach(p=> print(`• <a class="link" href="${p.url}" target="_blank" rel="noreferrer noopener">${esc(p.name)}</a> — ${esc(p.desc)}`));
  });

  register('', 'Fallback for unknown commands', (args)=>{ if(!args || !args.length) { return; } });

  function applyTheme(name){
    document.body.classList.remove('theme-light','theme-matrix');
    if(name==='light') document.body.classList.add('theme-light');
    if(name==='matrix') document.body.classList.add('theme-matrix');
    state.theme = name; themeIndicator.textContent = `theme: ${name}`;
    print(`Switched theme to ${name}.`);
  }

  (function boot(){
    print(`<span class="muted">Initializing webterm v1.0…</span>`);
    applyTheme('dark');
    print(`Type <span class="accent">help</span> to get started.`);
    prompt();
    document.querySelector('.frame').addEventListener('click', ()=>{
      const i = document.getElementById('input'); if(i) i.focus();
    });
  })();
  </script>
</body>
</html>
